# Builds and publishes a k8s-operator image for the fix-cert-secret-cleanup
# branch (https://github.com/tailscale/tailscale/issues/17734) to this fork's
# GitHub Container Registry, so it can be tested in a real cluster before the
# fix is submitted upstream. Runs entirely on GitHub-hosted runners; nothing
# is built or pushed locally.
name: Build fix-cert-secret-cleanup operator image

on:
  push:
    branches:
      - fix-cert-secret-cleanup-ci
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix-cert-secret-cleanup
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push k8s-operator image
        run: |
          make publishdevoperator \
            REPO=ghcr.io/${{ github.repository_owner }}/k8s-operator \
            TAGS=fix-cert-secret-cleanup \
            PLATFORM=linux/amd64,linux/arm64
